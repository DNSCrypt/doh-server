[package]
name = "doh-proxy"
version = "0.10.0"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "DNS over HTTPS (DoH) and Oblivious DoH (ODoH) server and proxy for existing DNS resolvers, with built-in TLS"
keywords = ["dns", "https", "doh", "odoh", "proxy"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-doh"
repository = "https://github.com/jedisct1/rust-doh"
categories = ["asynchronous", "network-programming", "command-line-utilities"]
edition = "2018"
readme = "README.md"

[features]
default = ["tls"]
tls = ["libdoh/tls"]

[dependencies]
libdoh = { path = "src/libdoh", version = "0.10", default-features = false }
clap = { version = "4", features = ["std", "cargo", "wrap_help", "string"] }
dnsstamps = "0.1"
mimalloc = { version = "0.1", default-features = false }

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/doh-proxy", dest = "/usr/bin/doh-proxy", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/doh-proxy/README.md", mode = "644", doc = true },
]

[package.metadata.deb]
extended-description = """\
A fast and secure DoH (DNS-over-HTTPS) and ODoH server written in Rust."""
assets = [
  [
    "target/release/doh-proxy",
    "usr/bin/",
    "755",
  ],
  [
    "README.md",
    "usr/share/doc/doh-proxy/README.md",
    "644",
  ],
]
section = "network"
depends = "$auto"
priority = "optional"

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"

[package]
name = "libdoh"
version = "0.10.0"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "DNS over HTTPS (DoH) and Oblivious DoH (ODoH) server library with Tokio, TLS, and DNS proxy support"
keywords = ["dns", "https", "doh", "odoh", "proxy"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-doh"
repository = "https://github.com/jedisct1/rust-doh"
categories = ["asynchronous", "network-programming", "command-line-utilities"]
edition = "2018"

[features]
default = ["tls"]
tls = ["tokio-rustls"]

[dependencies]
anyhow = "1"
arc-swap = "1"
base64 = "0.23"
byteorder = "1"
bytes = "1"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = [
    "server",
    "http1",
    "http2",
] }
hyper-util = { version = "0.1", default-features = false, features = [
    "server-auto",
    "tokio",
] }
odoh-rs = "1.0.5"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "net",
    "rt-multi-thread",
    "time",
    "sync",
] }
urlencoding = "2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "early-data",
    "logging",
    "ring",
    "tls12",
], optional = true }

[dev-dependencies]
h2 = "0.4"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"

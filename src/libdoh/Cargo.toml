[package]
name = "libdoh"
version = "0.9.16"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "DoH and Oblivious DoH library for the rust-doh app"
keywords = ["dns", "https", "doh", "odoh", "proxy"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-doh"
repository = "https://github.com/jedisct1/rust-doh"
categories = ["asynchronous", "network-programming", "command-line-utilities"]
edition = "2018"

[features]
default = ["tls"]
tls = ["tokio-rustls"]

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
base64 = "0.23.1"
byteorder = "1.5.0"
bytes = "1.12.1"
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false, features = [
    "server",
    "http1",
    "http2",
] }
hyper-util = { version = "0.1.20", default-features = false, features = [
    "server-auto",
    "tokio",
] }
odoh-rs = "1.0.4"
rand = "0.10.2"
rand_core_compat = { version = "0.1.1", default-features = false, features = [
    "rand_core_0_9",
    "rand_core_0_10",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "io-util",
    "net",
    "rt-multi-thread",
    "time",
    "sync",
] }
urlencoding = "2.1.3"
tokio-rustls = { version = "0.26.5", default-features = false, features = [
    "early-data",
    "logging",
    "ring",
    "tls12",
], optional = true }

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
